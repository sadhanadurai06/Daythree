<!DOCTYPE html>
<html>
<head>
  <title>Logout</title>
  <script>
    function logout() {
      document.getElementById("message").textContent = "You have been logged out.";
    }
  </script>
</head>
<body>

  <h2>Welcome, User</h2>
  <button onclick="logout()">Logout</button>

  <p id="message"></p>

</body>
</html>
